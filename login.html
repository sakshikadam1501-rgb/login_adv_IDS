<!DOCTYPE html>
<html>
<head>
    <title>Secure Login</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
            text-align: center;
            margin-top: 100px;
        }
        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            background: #00c6ff;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>🔐 Smart Login System</h2>

<input id="username" placeholder="Username"><br>
<input id="password" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

<p id="result"></p>

<script>
function login() {
    fetch("http://127.0.0.1:8000/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username: document.getElementById("username").value,
            login_hour: new Date().getHours(),
            failed_attempts: 0,
            ip_change: 0,
            device_change: 0
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerText =
            "Result: " + data.result + " | Risk: " + data.risk_score;
    });
}
</script>

</body>
</html>
